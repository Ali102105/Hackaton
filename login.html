<!doctype html>
<html lang="nl" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · ARCADE</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <a class="auth-logo" href="index.html">ARCADE</a>
    <a href="index.html" class="back-circle"> ← </a>
    <main class="auth-wrap">
      <section class="auth-card">
        <p class="auth-eyebrow">Welcome back</p>
        <h1>Login</h1>
        <p class="auth-sub">Log in om je arcade profiel te gebruiken.</p>

        <form id="loginForm" class="auth-form">
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
        </form>

        <p id="message" class="auth-message"></p>

        <p class="auth-switch">
          Geen account?
          <a href="register.html">Register</a>
        </p>
      </section>
    </main>

    <script type="module">
      import "./js/firebase-auth.js";

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            await window.loginUser(email, password);
            window.location.href = "index.html";
          } catch (error) {
            document.getElementById("message").textContent =
              "Email of wachtwoord klopt niet.";
          }
        });
    </script>
  </body>
</html>
