<!doctype html>
<html lang="nl" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · ARCADE</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <a class="auth-logo" href="index.html">ARCADE</a>
    <a href="index.html" class="back-circle"> ← </a>
    <main class="auth-wrap">
      <section class="auth-card">
        <p class="auth-eyebrow">Join the arcade</p>
        <h1>Create Account</h1>
        <p class="auth-sub">Maak een account om je progressie te bewaren.</p>

        <form id="registerForm" class="auth-form">
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Register</button>
        </form>

        <p id="message" class="auth-message"></p>

        <p class="auth-switch">
          Al een account?
          <a href="login.html">Login</a>
        </p>
      </section>
    </main>

    <script type="module">
      import "./js/firebase-auth.js";

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            await window.registerUser(email, password);
            window.location.href = "index.html";
          } catch (error) {
            document.getElementById("message").textContent = error.message;
          }
        });
    </script>
  </body>
</html>
